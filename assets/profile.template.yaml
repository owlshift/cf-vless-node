proxy-groups:
  # 用户只碰这个 select 组，界面保持选「自动」。
  # 为什么不直接把 url-test 暴露给用户：在 url-test 组里手点任意成员会把该组永久钉死，
  # fixed 会写进 cache.db 且重启客户端不失效 —— 对不折腾命令行的人来说是个静默的坏配置。
  - name: CF
    type: select
    proxies: [自动, 节点A, 节点B, 节点C, 节点D, 节点E, 节点F, 节点G, 节点H]
  - name: 自动
    type: url-test
    hidden: true
    proxies: [节点A, 节点B, 节点C, 节点D, 节点E, 节点F, 节点G, 节点H]
    url: https://cp.cloudflare.com/generate_204
    interval: 120
    tolerance: 150    # 只有快过这个差值才切换；小于它的波动不算"卡住"

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT     # 注意：中文"测我的 IP"站点会被这条判成直连
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,CF
